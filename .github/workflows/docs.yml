name: Docs

# The documentation site (DocFX: conceptual guides + API reference generated from the XML docs),
# published to GitHub Pages on every push to master that touches docs or source (the API reference
# follows the code). Requires Pages to be enabled with "GitHub Actions" as the source.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools (docfx, pinned)
        run: dotnet tool restore
      - name: Build site
        run: dotnet docfx docs/docfx.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
